<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Observer - Global Plane Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Glass Panel Controls -->
        <div class="glass-panel top-left">
            <div class="brand">
                <div class="brand-icon">✈</div>
                <div class="brand-text">Sky Observer</div>
            </div>
        </div>

        <div class="glass-panel top-right">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="planeCount">0</div>
                    <div class="stat-label">Aircraft</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="notamCount">0</div>
                    <div class="stat-label">NOTAMs</div>
                </div>
            </div>
        </div>

        <div class="glass-panel bottom-left">
            <div class="control-group">
                <button id="togglePlanes" class="glass-btn">
                    <span class="btn-icon">🌍</span>
                    <span class="btn-text">Track Planes</span>
                </button>
                <button id="toggleRain" class="glass-btn">
                    <span class="btn-icon">🌧️</span>
                    <span class="btn-text">Weather</span>
                </button>
                <button id="toggleNotams" class="glass-btn">
                    <span class="btn-icon">📍</span>
                    <span class="btn-text">NOTAMs</span>
                </button>
                <button id="loadRealNotams" class="glass-btn">
                    <span class="btn-icon">📡</span>
                    <span class="btn-text">Load Real NOTAMs</span>
                </button>
            </div>
            <div id="status" class="status-text"></div>
        </div>

        <div class="glass-panel bottom-right" id="infoPanel" style="display: none;">
            <div class="info-header">
                <span id="infoTitle">Aircraft Info</span>
                <button id="closeInfo" class="close-btn">×</button>
            </div>
            <div id="infoContent" class="info-content"></div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
</body>
</html>
